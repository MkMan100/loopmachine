name: Build VST3 and Standalone (Windows)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Advanced-Dub-Looper-VST3
        path: build/AdvancedLooper_artefacts/Release/VST3/

    - name: Upload Standalone EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Advanced-Dub-Looper-Standalone
        path: build/AdvancedLooper_artefacts/Release/Standalone/
